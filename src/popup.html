<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英汉翻译 · 设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="heading"><span class="logo" aria-hidden="true">译</span><div><h1>英汉翻译</h1><p>让阅读，少一点打断。</p></div><span class="version">1.5.1</span></header>
    <section class="intro" aria-label="使用方法">
      <span class="section-label">随选随译</span>
      <h2>一个单词，或一整段想法。</h2>
      <p>选中英文，按下快捷键。<br>译文会出现在选区旁边。</p>
      <div class="shortcut" id="shortcut" aria-label="当前翻译快捷键">正在读取快捷键…</div>
      <div class="shortcut-bottom"><span>也可以右键 → 翻译选中文字</span><button id="configure-shortcut" class="text-button">修改快捷键 ↗</button></div>
    </section>

    <section class="preferences" aria-labelledby="preferences-title">
      <div class="section-heading"><h2 id="preferences-title">阅读偏好</h2><span id="save-status" role="status" aria-live="polite">加载中…</span></div>
      <label class="row"><span><strong>自动朗读原文</strong><small>翻译完成后，自动播放英文</small></span><input id="autoSpeak" class="switch" type="checkbox" role="switch"></label>
      <div class="row rate-row"><label for="speechRate"><strong>朗读速度</strong></label><div class="rate-controls"><input id="speechRate" type="range" min="0.5" max="1.5" step="0.1" value="1"><output id="rate-value" for="speechRate">1.0×</output></div></div>
      <div class="field"><label for="speechVoice">朗读声音</label><select id="speechVoice"><option value="">浏览器默认英文声音</option></select><button id="preview-voice" class="text-button">试听声音</button></div>
      <div class="row"><label for="phoneticType"><strong>单词音标</strong></label><select id="phoneticType"><option value="dj">中国音标（DJ）</option><option value="ipa">国际音标（IPA）</option></select></div>
      <div class="row last"><label for="translationProvider"><strong>翻译服务</strong></label><select id="translationProvider"><option value="auto">自动选择</option><option value="google">Google 优先</option><option value="chinese">百度代理优先</option></select></div>
    </section>
    <footer><span class="dot"></span><span>设置在不同网站间通用 · Esc 关闭查询浮窗</span></footer>
    <p class="note">仅在触发查询时，将选中文字发送到翻译服务；单词额外查询词典。每次最多 5,000 字符。更新扩展后请刷新网页。</p>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
